  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #072F1F; }
    #app-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; background: #072F1F; z-index: 1; }
    #app-frame.is-ready { opacity: 1; }
    #shell-boot.is-done { display: none !important; pointer-events: none !important; }

    
    #shell-boot.boot-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      background: #072F1F;
      overflow: hidden;
    }
    #shell-boot .boot-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }
    /* Shared lockup: mark stays viewport-centered; name sits beside without shifting it */
    #shell-boot .boot-lockup {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      padding: 1.75rem;
      transition: none;
    }
    #shell-boot .boot-mark {
      position: relative;
      z-index: 2;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: #0A3A28;
      border: 1.5px solid #B4F105;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 200px;
      overflow: hidden;
      box-sizing: border-box;
      margin: 0 auto;
      transition: width 0.85s cubic-bezier(0.4, 0, 0.15, 1),
                  height 0.85s cubic-bezier(0.4, 0, 0.15, 1),
                  background-color 0.7s ease,
                  border-color 0.7s ease,
                  box-shadow 0.7s ease,
                  transform 0.85s cubic-bezier(0.4, 0, 0.15, 1);
    }
    #shell-boot .boot-mark-stage {
      position: relative;
      width: 112px;
      height: 112px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      animation: bootFrameSettle 5.8s cubic-bezier(0.22, 1, 0.36, 1) both;
      transform-origin: center center;
      transition: width 0.85s cubic-bezier(0.4, 0, 0.15, 1),
                  height 0.85s cubic-bezier(0.4, 0, 0.15, 1);
    }
    #shell-boot .boot-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      margin: 0;
      padding: 0;
    }
    #shell-boot .boot-face-logo,
    #shell-boot .boot-face-logo .boot-logo {
      margin: 0 auto;
    }
    #shell-boot .boot-face-logo {
      z-index: 2;
    }
    #shell-boot .boot-face-logo.is-on {
      opacity: 1 !important;
    }
    #shell-boot .boot-logo {
      width: 58px;
      height: 58px;
      display: block;
      margin: 0 auto;
      transform-origin: 50% 50%;
      opacity: 0;
      animation: bootLogoIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 3.05s forwards;
      transition: width 0.85s cubic-bezier(0.4, 0, 0.2, 1),
                  height 0.85s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #shell-boot .boot-logo-arm {
      fill: #B4F105;
    }
    #shell-boot .boot-logo .boot-icon-hub {
      fill: #F4EFE3;
    }
    #shell-boot .boot-brand-name {
      position: absolute;
      left: calc(50% + 56px + 0.3rem);
      top: 50%;
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #F4EFE3;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(-50%);
      animation: bootNameShow 0.2s linear 3.05s forwards;
      transition: left 0.85s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #shell-boot .boot-letter {
      display: inline-block;
      opacity: 0;
      transform: translateY(0.28em);
      filter: blur(6px);
      animation: bootLetterIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: calc(3.08s + (var(--i) * 0.07s));
      will-change: transform, opacity, filter;
    }
    #shell-boot .boot-brand-name.brand-word::after {
      content: '';
      display: inline-block;
      width: 0.2em;
      height: 0.2em;
      margin-left: 0.02em;
      border-radius: 50%;
      background: #B4F105;
      vertical-align: baseline;
      position: relative;
      top: -0.02em;
      opacity: 0;
      transform: translateY(0.28em) scale(0.4);
      filter: blur(4px);
      transform-origin: 50% 50%;
      animation: bootPeriodPop 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 3.45s;
    }
    /* #9 slow ring motion around the mark */
    #shell-boot .boot-spin-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 120px;
      height: 120px;
      margin: -60px 0 0 -60px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: #7EB8A2;
      border-right-color: rgba(180, 241, 5, 0.35);
      box-sizing: border-box;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      animation: bootSpinRing 5.8s linear both;
    }
    #shell-boot .boot-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform-origin: 50% 55%;
    }
    #shell-boot .boot-face-notebook { animation: bootFaceNotebook 5.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
    #shell-boot .boot-face-write { animation: bootFaceWrite 5.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
    #shell-boot .boot-face-tasks { animation: bootFaceTasks 5.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
    #shell-boot .boot-face-logo { animation: bootFaceLogo 5.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    #shell-boot .boot-face-notebook,
    #shell-boot .boot-face-write,
    #shell-boot .boot-face-tasks {
      align-items: flex-start;
      padding-top: 1.45rem;
    }
    #shell-boot .boot-glyph {
      width: 32px;
      height: 32px;
      display: block;
      overflow: visible;
      transform-origin: 50% 50%;
      transform-style: preserve-3d;
    }
    #shell-boot .boot-nb-page {
      transform-origin: 4px 12px;
      transform-box: fill-box;
      transform-style: preserve-3d;
      animation: bootNotebookPage 5.8s cubic-bezier(0.45, 0.05, 0.35, 1) both;
    }
    #shell-boot .boot-nb-body {
      transform-origin: 50% 55%;
      animation: bootNotebookBody 5.8s cubic-bezier(0.34, 1.4, 0.64, 1) both;
    }
    #shell-boot .boot-pen {
      transform-origin: 4px 20px;
      transform-box: fill-box;
      animation: bootPenWrite 5.8s cubic-bezier(0.4, 0.05, 0.45, 0.95) both;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.35));
    }
    #shell-boot .boot-write-doc {
      transform-origin: 50% 50%;
      animation: bootWriteDoc 5.8s cubic-bezier(0.34, 1.25, 0.64, 1) both;
    }
    #shell-boot .boot-ink {
      stroke: #B4F105;
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
      opacity: 0;
      filter: drop-shadow(0 0 2px rgba(180, 241, 5, 0.45));
    }
    #shell-boot .boot-ink-1 { animation: bootInk1 5.8s linear both; }
    #shell-boot .boot-ink-2 { animation: bootInk2 5.8s linear both; }
    #shell-boot .boot-ink-3 { animation: bootInk3 5.8s linear both; }
    #shell-boot .boot-check-row {
      transform-origin: 4px 50%;
      transform-box: fill-box;
    }
    #shell-boot .boot-check-row-1 { animation: bootCheckRow 5.8s cubic-bezier(0.22, 1.4, 0.36, 1) both; }
    #shell-boot .boot-check-row-2 { animation: bootCheckRow 5.8s cubic-bezier(0.22, 1.4, 0.36, 1) 0.16s both; }
    #shell-boot .boot-check-row-3 { animation: bootCheckRow 5.8s cubic-bezier(0.22, 1.4, 0.36, 1) 0.32s both; }
    #shell-boot .boot-icon {
      fill: none;
      stroke: #B4F105;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #shell-boot .boot-icon-soft { stroke: #7EB8A2; stroke-width: 1.25; }
    #shell-boot .boot-icon-fill { fill: rgba(180, 241, 5, 0.12); stroke: #B4F105; stroke-width: 1.25; }
    #shell-boot .boot-icon-hub { fill: #F4EFE3; stroke: none; }
    #shell-boot .boot-draw-on {
      stroke-dasharray: 72;
      stroke-dashoffset: 72;
    }
    #shell-boot .boot-face-notebook .boot-draw-on {
      animation: bootDrawNotebook 5.8s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    #shell-boot .boot-face-notebook .boot-draw-on-2 { animation-delay: 0.08s; }
    #shell-boot .boot-face-notebook .boot-draw-on-3 { animation-delay: 0.14s; }
    #shell-boot .boot-draw-line {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: bootStrokeLine 5.8s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    #shell-boot .boot-draw-line-2 { animation-delay: 0.14s; }
    #shell-boot .boot-draw-line-3 { animation-delay: 0.28s; }
    #shell-boot .boot-pen .boot-draw-on {
      animation: bootDrawPen 5.8s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    #shell-boot .boot-check {
      stroke-dasharray: 26;
      stroke-dashoffset: 26;
      transform-box: fill-box;
      transform-origin: center;
      animation: bootCheckDraw 5.8s cubic-bezier(0.34, 1.5, 0.64, 1) both;
    }
    #shell-boot .boot-check-row-2 .boot-check { animation-delay: 0.12s; }
    #shell-boot .boot-check-row-3 .boot-check { animation-delay: 0.24s; }
    #shell-boot .boot-task-line {
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      animation: bootTaskLineDraw 5.8s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    #shell-boot .boot-check-row-2 .boot-task-line { animation-delay: 0.12s; }
    #shell-boot .boot-check-row-3 .boot-task-line { animation-delay: 0.24s; }
    /* exit wipe handled below */
    /* Captions live inside the circle, under the morph icon */
    #shell-boot .boot-captions {
      position: absolute;
      left: calc(50% - 0.5px);
      top: auto;
      bottom: 0.85rem;
      transform: translateX(-50%);
      width: 5.6rem;
      min-height: 1.7rem;
      pointer-events: none;
      z-index: 5;
      animation: bootCaptionsLife 5.8s ease-in-out both;
    }
    #shell-boot .boot-caption {
      position: absolute;
      left: 50%;
      top: 0;
      width: 100%;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.25;
      text-align: center;
      color: rgba(244, 239, 227, 0.78);
      white-space: normal;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(2px);
    }
    #shell-boot .boot-caption-1 { animation: bootCaption1 5.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
    #shell-boot .boot-caption-2 { animation: bootCaption2 5.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
    #shell-boot .boot-caption-3 { animation: bootCaption3 5.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
    #shell-boot.is-mark-fading .boot-captions {
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    #shell-boot.is-mark-faded .boot-captions {
      opacity: 0 !important;
      visibility: hidden;
    }
    #shell-boot .boot-ripple {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 112px;
      height: 112px;
      margin: -56px 0 0 -56px;
      border-radius: 50%;
      border: 2px solid #B4F105;
      box-sizing: border-box;
      opacity: 0;
      pointer-events: none;
      animation: bootRipple 0.95s cubic-bezier(0.15, 0.75, 0.25, 1) 3.35s both;
    }
    #shell-boot .boot-ripple-2 {
      border-color: #7EB8A2;
      animation-delay: 3.45s;
      animation-duration: 1.05s;
    }
    #shell-boot .boot-ripple-3 {
      border-color: #F4EFE3;
      animation-delay: 3.55s;
      animation-duration: 1.15s;
    }
    #shell-boot .boot-drop {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 9px;
      height: 9px;
      margin: -4.5px 0 0 -4.5px;
      border-radius: 50%;
      background: #B4F105;
      opacity: 0;
      pointer-events: none;
      animation: bootDrop 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) 3.38s both;
    }
    #shell-boot .boot-drop:nth-child(4) { --tx: 52px; --ty: -34px; width: 10px; height: 10px; }
    #shell-boot .boot-drop:nth-child(5) { --tx: -48px; --ty: -30px; background: #F4EFE3; animation-delay: 3.42s; width: 7px; height: 7px; }
    #shell-boot .boot-drop:nth-child(6) { --tx: 58px; --ty: 18px; background: #7EB8A2; animation-delay: 3.4s; width: 8px; height: 8px; }

      #shell-boot .boot-drop,
      #shell-boot .boot-flash { display: none; }
    }
  </style>
</head>
<body>
<div id="shell-boot" class="boot-screen" role="status" aria-label="Loading">
    <div class="boot-stack">
      <div class="boot-lockup">
        <div class="boot-mark-stage">
          <span class="boot-ripple boot-ripple-1" aria-hidden="true"></span>
          <span class="boot-ripple boot-ripple-2" aria-hidden="true"></span>
          <span class="boot-ripple boot-ripple-3" aria-hidden="true"></span>
          <span class="boot-drop" aria-hidden="true"></span>
          <span class="boot-drop" aria-hidden="true"></span>
          <span class="boot-drop" aria-hidden="true"></span>
          <span class="boot-drop" aria-hidden="true"></span>
          <span class="boot-drop" aria-hidden="true"></span>
          <span class="boot-drop" aria-hidden="true"></span>
          <span class="boot-drop" aria-hidden="true"></span>
          <span class="boot-drop" aria-hidden="true"></span>
          <span class="boot-flash" aria-hidden="true"></span>
          <span class="boot-spin-ring" aria-hidden="true"></span>

          <div class="boot-mark">
            <div class="boot-face boot-face-notebook" aria-hidden="true">
              <svg class="boot-glyph" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g class="boot-nb-body">
                  <path class="boot-icon boot-draw-on" d="M2 6h4M2 10h4M2 14h4M2 18h4" />
                  <rect class="boot-icon boot-draw-on boot-draw-on-2" x="4" y="2" width="14" height="20" rx="2.5" />
                  <path class="boot-icon boot-icon-soft boot-draw-on boot-draw-on-3" d="M8 7h6M8 11h6M8 15h4" />
                </g>
                <g class="boot-nb-page">
                  <rect class="boot-icon-fill" x="5" y="3" width="12" height="18" rx="1.5" />
                  <path class="boot-icon boot-icon-soft" d="M8 8h6M8 12h5" opacity="0.7" />
                </g>
              </svg>
            </div>
            <div class="boot-face boot-face-write" aria-hidden="true">
              <svg class="boot-glyph" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g class="boot-write-doc">
                  <path class="boot-icon boot-draw-on" d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                  <path class="boot-icon boot-icon-soft" d="M14 2v6h6" />
                  <path class="boot-icon boot-icon-soft" d="M8 9h5M8 13h8M8 17h6" opacity="0.35" />
                  <path class="boot-ink boot-ink-1" d="M8 9h5" />
                  <path class="boot-ink boot-ink-2" d="M8 13h8" />
                  <path class="boot-ink boot-ink-3" d="M8 17h6" />
                </g>
                <g class="boot-pen">
                  <path class="boot-icon boot-draw-on" d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                </g>
              </svg>
            </div>
            <div class="boot-face boot-face-tasks" aria-hidden="true">
              <svg class="boot-glyph" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g class="boot-check-row boot-check-row-3">
                  <path class="boot-icon boot-check" d="m3 5 2 2 4-4" />
                  <path class="boot-icon boot-icon-soft boot-task-line" d="M13 6h8" />
                </g>
                <g class="boot-check-row boot-check-row-2">
                  <path class="boot-icon boot-check" d="m3 11 2 2 4-4" />
                  <path class="boot-icon boot-icon-soft boot-task-line" d="M13 12h8" />
                </g>
                <g class="boot-check-row boot-check-row-1">
                  <path class="boot-icon boot-check" d="m3 17 2 2 4-4" />
                  <path class="boot-icon boot-icon-soft boot-task-line" d="M13 18h8" />
                </g>
              </svg>
            </div>
            <div class="boot-face boot-face-logo">
              <svg class="boot-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <g transform="translate(50,50)">
                  <rect class="boot-logo-arm" x="-5" y="-34" width="10" height="68" rx="5" />
                  <rect class="boot-logo-arm" x="-5" y="-34" width="10" height="68" rx="5" transform="rotate(60)" />
                  <rect class="boot-logo-arm" x="-5" y="-34" width="10" height="68" rx="5" transform="rotate(120)" />
                  <circle class="boot-icon-hub" r="9" />
                </g>
              </svg>
            </div>
            <div class="boot-captions" aria-hidden="true">
            <span class="boot-caption boot-caption-1">Record your day</span>
            <span class="boot-caption boot-caption-2">Log your hours</span>
            <span class="boot-caption boot-caption-3">Track your tasks</span>
            </div>
          </div>
        </div>
        <div class="boot-brand-name brand-word" aria-label="Tiyo">
          <span class="boot-letter" style="--i:0">T</span><span class="boot-letter" style="--i:1">i</span><span class="boot-letter" style="--i:2">y</span><span class="boot-letter" style="--i:3">o</span>
        </div>
      </div>
    </div>
  </div>
  <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbyk8PzPuRuE9fTJFiq0ZBubXDtkluqPZgp4XilsvwGKSVQg6pr1clCJiN5UMQDVCrKd/exec?shell=1" title="Tiyo" allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <script>
    (function () {
      var frame = document.getElementById('app-frame');
      var boot = document.getElementById('shell-boot');
      var shown = false, frameReady = false;
      var BOOT_SEEN_KEY = 'tiyo_boot_seen';
      var BOOT_EXIT_MS = 750, BOOT_COLLAPSE_MS = 420, BOOT_LOGO_LAND_MS = 3050;
      var BOOT_BRIEF_EXIT_MS = 550;
      var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      var seen = false;
      try { seen = sessionStorage.getItem(BOOT_SEEN_KEY) === '1'; } catch (e) {}
      var brief = seen || reduceMotion;
      var BOOT_HOLD_MS = brief ? 500 : 6000;
      var bootStartedAt = (window.performance && performance.now) ? performance.now() : Date.now();

      function markSeen() {
        try { sessionStorage.setItem(BOOT_SEEN_KEY, '1'); } catch (e) {}
      }
      function haptic(ms) {
        try {
          if (brief || reduceMotion) return;
          if (navigator.vibrate) navigator.vibrate(ms || 10);
        } catch (e) {}
      }
      function centerBrandNow() {
        var lockup = boot.querySelector('.boot-lockup');
        if (!lockup) return;
        lockup.classList.add('is-branded');
        var nameEl = lockup.querySelector('.boot-brand-name');
        var nameWidth = nameEl ? Math.max(nameEl.scrollWidth, nameEl.offsetWidth, 96) : 96;
        lockup.style.setProperty('--brand-shift', (-(nameWidth + 6) / 2) + 'px');
        lockup.classList.add('is-brand-settled');
      }
      function fadeMarkAway() {
        if (!boot || boot.classList.contains('is-mark-faded') || boot.classList.contains('is-mark-fading')) return;
        boot.classList.add('is-mark-fading');
        window.setTimeout(function () {
          boot.classList.add('is-mark-faded');
          boot.classList.remove('is-mark-fading');
          centerBrandNow();
        }, 850);
      }

      if (brief) {
        boot.classList.add('is-boot-brief', 'is-mark-faded');
        var logoFaceBrief = boot.querySelector('.boot-face-logo');
        if (logoFaceBrief) logoFaceBrief.classList.add('is-on');
        centerBrandNow();
        window.requestAnimationFrame(function () { centerBrandNow(); });
      } else {
        [1280, 2320, BOOT_LOGO_LAND_MS].forEach(function (at) {
          window.setTimeout(function () { haptic(10); }, at);
        });
        window.setTimeout(function () {
          var logoFace = boot.querySelector('.boot-face-logo');
          if (logoFace) logoFace.classList.add('is-on');
          centerBrandNow();
          window.setTimeout(fadeMarkAway, 80);
        }, BOOT_LOGO_LAND_MS);
      }

      function finish() {
        if (shown || !frameReady) return;
        var elapsed = (window.performance && performance.now)
          ? (performance.now() - bootStartedAt)
          : BOOT_HOLD_MS;
        var wait = Math.max(0, BOOT_HOLD_MS - elapsed);
        window.setTimeout(function () {
          if (shown) return;
          shown = true;
          markSeen();
          frame.classList.add('is-ready');
          if (brief) {
            boot.classList.add('is-brief-exiting');
            window.setTimeout(function () {
              boot.classList.add('is-done');
              boot.setAttribute('aria-hidden', 'true');
            }, BOOT_BRIEF_EXIT_MS);
            return;
          }
          boot.classList.add('is-collapsing');
          window.setTimeout(function () {
            boot.classList.add('is-exiting');
            window.setTimeout(function () {
              boot.classList.add('is-done');
              boot.setAttribute('aria-hidden', 'true');
            }, BOOT_EXIT_MS);
          }, BOOT_COLLAPSE_MS);
        }, wait);
      }
      frame.addEventListener('load', function () { frameReady = true; finish(); });
      window.setTimeout(function () { frameReady = true; finish(); }, 12000);
    })();
  </script>
</body>
</html>
