<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Daily Diary</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23072F1F'/%3E%3Cg transform='translate(50,50)' fill='%23B4F105'%3E%3Crect x='-6' y='-36' width='12' height='72' rx='6'/%3E%3Crect x='-6' y='-36' width='12' height='72' rx='6' transform='rotate(60)'/%3E%3Crect x='-6' y='-36' width='12' height='72' rx='6' transform='rotate(120)'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #072F1F;
    }
    .shell-boot {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #072F1F;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    .shell-boot.is-done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .shell-logo {
      width: 96px;
      height: 96px;
      display: block;
      transform-origin: 50% 50%;
      animation: spinLogo 2.2s linear infinite;
    }
    @keyframes spinLogo {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    iframe {
      position: fixed;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    iframe.is-ready {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="shell-boot" id="shell-boot" aria-hidden="false">
    <svg class="shell-logo" viewBox="0 0 100 100" width="96" height="96" fill="none" xmlns="http://www.w3.org/2000/svg" role="status" aria-label="Loading Daily Diary">
      <g transform="translate(50,50)">
        <rect x="-6" y="-45" width="12" height="90" rx="6" ry="6" fill="#B4F105" />
        <rect x="-6" y="-45" width="12" height="90" rx="6" ry="6" fill="#B4F105" transform="rotate(60)" />
        <rect x="-6" y="-45" width="12" height="90" rx="6" ry="6" fill="#B4F105" transform="rotate(120)" />
      </g>
    </svg>
  </div>
  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbyk8PzPuRuE9fTJFiq0ZBubXDtkluqPZgp4XilsvwGKSVQg6pr1clCJiN5UMQDVCrKd/exec"
    title="Daily Diary"
    allow="clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
  <script>
    (function () {
      var frame = document.getElementById('app-frame');
      var boot = document.getElementById('shell-boot');
      var shown = false;
      function reveal() {
        if (shown) return;
        shown = true;
        frame.classList.add('is-ready');
        boot.classList.add('is-done');
        boot.setAttribute('aria-hidden', 'true');
      }
      frame.addEventListener('load', function () {
        window.setTimeout(reveal, 280);
      });
      window.setTimeout(reveal, 12000);
    })();
  </script>
</body>
</html>
