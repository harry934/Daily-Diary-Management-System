<script>
(function () {
  var TOKEN_KEY = 'dailyDiaryToken';
  var EMAIL_KEY = 'dailyDiaryEmail';
  var DRAFT_PREFIX = 'dailyDiaryDraft:';
  var MINUTES = ['00', '15', '30', '45'];
  var PRIORITY_LABELS = { urgent: 'Urgent', high: 'High', medium: 'Medium', low: 'Low' };
  var draftTimer = null;
  var applyingDay = false;
  var state = {
    token: '',
    profile: null,
    date: '',
    weekStart: '',
    day: null,
    leftBeforeNoon: false,
    timeIn: null,
    timeOut: null,
    panel: 'diary',
    tasks: [],
    taskFilter: 'all',
    taskToday: '',
    editingTaskId: '',
    report: null
  };

  var ICONS = {
    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    envelope: '<rect x="3" y="5" width="18" height="14"/><path d="m3 7 9 6 9-6"/>',
    shield: '<path d="M12 3 4 6v6c0 5 3.4 7.8 8 9 4.6-1.2 8-4 8-9V6z"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    'eye-off': '<path d="M3 3l18 18"/><path d="M10.6 10.6A3 3 0 0 0 13.4 13.4"/><path d="M9.9 5.1A11 11 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-4.2 4.8"/><path d="M6.1 6.1C3.5 7.8 2 12 2 12s3.5 7 10 7a11 11 0 0 0 4.2-.8"/>',
    lock: '<rect x="5" y="11" width="14" height="10"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    alert: '<path d="M12 3 2 20h20L12 3z"/><path d="M12 9v5"/><path d="M12 17h.01"/>',
    'arrow-right': '<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/>',
    building: '<path d="M4 21V5l8-2 8 2v16"/><path d="M9 21v-6h6v6"/><path d="M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/>',
    calendar: '<rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    grid: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
    chart: '<path d="M4 20V10M12 20V4M20 20v-7"/>',
    check: '<path d="M9 11 4 16l5 5"/><path d="M4 16h16"/>',
    users: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c.8-3 3.2-5 6-5s5.2 2 6 5M14 20c.4-2 1.8-3.5 3.5-3.5 1.5 0 2.8 1 3.5 2.5"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    sheet: '<rect x="5" y="3" width="14" height="18"/><path d="M9 7h6M9 11h6M9 15h4"/>',
    'chevron-down': '<path d="m6 9 6 6 6-6"/>',
    'chevron-left': '<path d="m15 18-6-6 6-6"/>',
    'chevron-right': '<path d="m9 6 6 6-6 6"/>',
    logout: '<path d="M10 17H5V7h5"/><path d="m14 16 5-4-5-4"/><path d="M19 12H9"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    save: '<path d="M5 5h11l3 3v11H5z"/><path d="M8 5v5h8"/><path d="M8 19v-6h8v6"/>',
    pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m15 5 4 4"/>',
    trash: '<path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/>',
    x: '<path d="M6 6l12 12M18 6 6 18"/>',
    bell: '<path d="M6 9a6 6 0 0 1 12 0c0 7 3 7 3 7H3s3 0 3-7"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    checkmark: '<path d="M5 13l4 4L19 7"/>',
    spin: '<path d="M12 3a9 9 0 1 1-9 9"/>'
  };

  function iconSvg(name) {
    var extra = name === 'spin' ? ' icon-spin' : '';
    return '<svg class="icon' + extra + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS.alert) + '</svg>';
  }

  function fillIcons(root) {
    (root || document).querySelectorAll('[data-icon]').forEach(function (el) {
      el.innerHTML = iconSvg(el.getAttribute('data-icon'));
    });
  }

  function $(id) {
    return document.getElementById(id);
  }

  function api(action, payload) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (result) {
          if (!result || result.ok === false) {
            reject(new Error((result && result.error) || 'Request failed.'));
            return;
          }
          resolve(result);
        })
        .withFailureHandler(function (err) {
          reject(new Error(err && err.message ? err.message : String(err)));
        })
        .api(action, payload || {});
    });
  }

  function setButtonBusy(button, busy, label) {
    if (!button) {
      return;
    }
    if (busy) {
      if (!button.getAttribute('data-idle-html')) {
        button.setAttribute('data-idle-html', button.innerHTML);
      }
      button.disabled = true;
      button.innerHTML = iconSvg('spin') + '<span>' + (label || 'Working…') + '</span>';
    } else {
      button.disabled = false;
      var idle = button.getAttribute('data-idle-html');
      if (idle) {
        button.innerHTML = idle;
      }
    }
  }

  function setPanelBusy(panelId, busy, message) {
    var panel = $(panelId);
    if (!panel) {
      return;
    }
    var overlay = panel.querySelector('.panel-busy');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'panel-busy d-none';
      overlay.innerHTML = '<div class="panel-busy-card">' + iconSvg('spin') + '<span></span></div>';
      panel.appendChild(overlay);
    }
    overlay.querySelector('span').textContent = message || 'Loading…';
    overlay.classList.toggle('d-none', !busy);
  }

  function initials(name) {
    var parts = String(name || 'Intern').trim().split(/\s+/).filter(Boolean);
    var letters = (parts[0] ? parts[0].charAt(0) : 'I') + (parts[1] ? parts[1].charAt(0) : '');
    return letters.toUpperCase();
  }

  function formatDisplayDate(iso) {
    var parts = String(iso || '').split('-');
    if (parts.length !== 3) {
      return iso;
    }
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return Number(parts[2]) + ' ' + months[Number(parts[1]) - 1] + ' ' + parts[0];
  }

  function parseTimeParts(hhmm) {
    var match = String(hhmm || '').match(/^(\d{1,2}):(\d{2})/);
    if (!match) {
      return { hour: '', minute: '', period: 'AM' };
    }
    var hour24 = Number(match[1]);
    var minute = match[2];
    if (MINUTES.indexOf(minute) === -1) {
      var nearest = MINUTES.reduce(function (best, option) {
        return Math.abs(Number(option) - Number(minute)) < Math.abs(Number(best) - Number(minute)) ? option : best;
      }, MINUTES[0]);
      minute = nearest;
    }
    var period = hour24 >= 12 ? 'PM' : 'AM';
    var hour12 = hour24 % 12;
    if (hour12 === 0) {
      hour12 = 12;
    }
    return { hour: String(hour12), minute: minute, period: period };
  }

  function toHHmm(hour12, minute, period) {
    if (!hour12 || !minute || !period) {
      return '';
    }
    var hour = Number(hour12);
    if (period === 'AM') {
      if (hour === 12) {
        hour = 0;
      }
    } else if (hour !== 12) {
      hour += 12;
    }
    return ('0' + hour).slice(-2) + ':' + minute;
  }

  function formatTimeLabel(hhmm) {
    var parts = parseTimeParts(hhmm);
    if (!hhmm || !parts.hour || !parts.minute) {
      return 'Set time';
    }
    return parts.hour + ':' + parts.minute + ' ' + parts.period;
  }

  function isMorningTime(hhmm) {
    var match = String(hhmm || '').match(/^(\d{1,2}):/);
    return !!(match && Number(match[1]) < 12);
  }

  function liveHours(timeIn, timeOut) {
    var startMatch = String(timeIn || '').match(/^(\d{1,2}):(\d{2})/);
    var endMatch = String(timeOut || '').match(/^(\d{1,2}):(\d{2})/);
    if (!startMatch || !endMatch) {
      return '—';
    }
    var start = Number(startMatch[1]) * 60 + Number(startMatch[2]);
    var end = Number(endMatch[1]) * 60 + Number(endMatch[2]);
    if (end <= start) {
      return '—';
    }
    return ((end - start) / 60).toFixed(2);
  }

  function addDaysIso(dateStr, days) {
    var parts = String(dateStr || '').split('-');
    var date = new Date(Date.UTC(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]) + days));
    return date.getUTCFullYear() + '-' +
      ('0' + (date.getUTCMonth() + 1)).slice(-2) + '-' +
      ('0' + date.getUTCDate()).slice(-2);
  }

  function weekdayIndex(dateStr) {
    var parts = String(dateStr || '').split('-');
    return new Date(Date.UTC(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]))).getUTCDay();
  }

  function previousWeekday(dateStr) {
    return addDaysIso(dateStr, -1);
  }

  function nextWeekday(dateStr) {
    return addDaysIso(dateStr, 1);
  }

  function draftKey(date) {
    return DRAFT_PREFIX + date;
  }

  function readDraft(date) {
    try {
      var raw = sessionStorage.getItem(draftKey(date));
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      return null;
    }
  }

  function writeDraftNow() {
    if (applyingDay || !state.date) {
      return;
    }
    var payload = {
      timeIn: state.timeIn ? state.timeIn.getValue() : '',
      timeOut: state.timeOut ? state.timeOut.getValue() : '',
      timeOutReason: $('time-out-reason').value,
      assignment: $('assignment-list').value,
      leftBeforeNoon: !!state.leftBeforeNoon,
      savedAt: new Date().toISOString()
    };
    sessionStorage.setItem(draftKey(state.date), JSON.stringify(payload));
  }

  function scheduleDraft() {
    if (applyingDay) {
      return;
    }
    clearTimeout(draftTimer);
    draftTimer = setTimeout(writeDraftNow, 400);
  }

  function clearDraft(date) {
    sessionStorage.removeItem(draftKey(date));
  }

  function stampMs(value) {
    if (!value) {
      return 0;
    }
    var parsed = Date.parse(String(value).replace(' ', 'T'));
    return isNaN(parsed) ? 0 : parsed;
  }

  function draftMatchesDay(day, draft) {
    return (draft.timeIn || '') === (day.timeIn || '') &&
      (draft.timeOut || '') === (day.timeOut || '') &&
      (draft.timeOutReason || '') === (day.timeOutReason || '') &&
      (draft.assignment || '') === (day.assignment || '');
  }

  function shouldRestoreDraft(day, draft) {
    if (!draft || draftMatchesDay(day, draft)) {
      return false;
    }
    if (!day.saved) {
      return true;
    }
    return stampMs(draft.savedAt) > stampMs(day.updatedAt);
  }

  function refreshHours() {
    var timeIn = state.timeIn ? state.timeIn.getValue() : '';
    var timeOut = state.timeOut ? state.timeOut.getValue() : '';
    $('hours-display').textContent = liveHours(timeIn, timeOut);
  }

  function syncReasonBox() {
    var timeOut = state.timeOut ? state.timeOut.getValue() : '';
    var show = !!state.leftBeforeNoon || isMorningTime(timeOut);
    $('reason-box').classList.toggle('d-none', !show);
  }

  function createClock(options) {
    var mode = options.mode || 'in';
    var allowMorning = mode === 'in' || !!options.allowMorning;
    var current = options.value || '';
    var draft = parseTimeParts(current);
    if (!draft.hour) {
      draft = {
        hour: mode === 'out' ? '5' : '8',
        minute: '00',
        period: mode === 'out' ? 'PM' : 'AM'
      };
    }
    if (mode === 'out' && !allowMorning) {
      draft.period = 'PM';
    }
    var committed = !!current;

    var wrap = document.createElement('div');
    wrap.className = 'clock-card';
    wrap.innerHTML =
      '<div class="clock-label"></div>' +
      '<div class="clock-readout"></div>' +
      '<div class="clock-stepper">' +
        '<button type="button" class="clock-step-btn" data-hour="-1" aria-label="Earlier hour">−</button>' +
        '<span class="clock-hour-label"></span>' +
        '<button type="button" class="clock-step-btn" data-hour="1" aria-label="Later hour">+</button>' +
      '</div>' +
      '<div class="clock-minutes"></div>' +
      '<div class="clock-period-row"></div>';
    wrap.querySelector('.clock-label').textContent = options.label || 'Time';

    var minutesRow = wrap.querySelector('.clock-minutes');
    MINUTES.forEach(function (item) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'clock-minute';
      chip.setAttribute('data-minute', item);
      chip.textContent = item;
      chip.addEventListener('click', function () {
        draft.minute = item;
        commit();
      });
      minutesRow.appendChild(chip);
    });

    wrap.querySelectorAll('[data-hour]').forEach(function (button) {
      button.addEventListener('click', function () {
        var hour = Number(draft.hour || (mode === 'out' ? 5 : 8)) + Number(button.getAttribute('data-hour'));
        if (hour > 12) {
          hour = 1;
        }
        if (hour < 1) {
          hour = 12;
        }
        draft.hour = String(hour);
        if (!draft.minute) {
          draft.minute = '00';
        }
        commit();
      });
    });

    function commit() {
      if (mode === 'out' && !allowMorning) {
        draft.period = 'PM';
      }
      current = toHHmm(draft.hour, draft.minute, draft.period);
      committed = true;
      paint();
      if (wrap._onChange) {
        wrap._onChange();
      }
    }

    function paintPeriod() {
      var row = wrap.querySelector('.clock-period-row');
      row.innerHTML = '';
      if (mode === 'in' || allowMorning) {
        ['AM', 'PM'].forEach(function (item) {
          var chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'clock-period' + (draft.period === item ? ' is-selected' : '');
          chip.textContent = item;
          chip.addEventListener('click', function () {
            draft.period = item;
            commit();
          });
          row.appendChild(chip);
        });
      } else {
        var locked = document.createElement('span');
        locked.className = 'clock-locked';
        locked.textContent = 'PM';
        row.appendChild(locked);
      }
      if (mode === 'out') {
        var leave = document.createElement('button');
        leave.type = 'button';
        leave.className = 'clock-leave' + (allowMorning ? ' is-on' : '');
        leave.textContent = 'Left before noon';
        leave.addEventListener('click', function () {
          allowMorning = !allowMorning;
          if (allowMorning) {
            draft.period = 'AM';
          } else {
            draft.period = 'PM';
          }
          if (wrap._onMorning) {
            wrap._onMorning(allowMorning);
          }
          commit();
        });
        row.appendChild(leave);
      }
    }

    function paint() {
      var display = toHHmm(draft.hour, draft.minute, draft.period);
      wrap.querySelector('.clock-readout').textContent = committed ? formatTimeLabel(display) : 'Set time';
      wrap.querySelector('.clock-hour-label').textContent = (draft.hour || '—') + ' o’clock';
      wrap.querySelectorAll('[data-minute]').forEach(function (chip) {
        chip.classList.toggle('is-selected', chip.getAttribute('data-minute') === draft.minute);
      });
      paintPeriod();
    }

    paint();

    wrap.getValue = function () {
      return committed ? toHHmm(draft.hour, draft.minute, draft.period) : '';
    };
    wrap.setValue = function (hhmm, morning) {
      current = hhmm || '';
      committed = !!current;
      draft = parseTimeParts(current);
      if (!draft.hour) {
        draft = {
          hour: mode === 'out' ? '5' : '8',
          minute: '00',
          period: mode === 'out' ? 'PM' : 'AM'
        };
      }
      if (mode === 'out') {
        allowMorning = !!morning || isMorningTime(current);
        if (!allowMorning) {
          draft.period = 'PM';
        }
      }
      paint();
    };
    wrap.setAllowMorning = function (on) {
      allowMorning = !!on;
      if (mode === 'out' && !allowMorning) {
        draft.period = 'PM';
      }
      paint();
    };
    wrap.onChange = function (handler) {
      wrap._onChange = handler;
    };
    wrap.onMorning = function (handler) {
      wrap._onMorning = handler;
    };
    return wrap;
  }

  function showToast(message, type) {
    var host = $('toast-host');
    var item = document.createElement('div');
    item.className = 'toast-item ' + (type || 'success');
    item.innerHTML = iconSvg(type === 'error' ? 'alert' : 'checkmark') + '<span></span>';
    item.querySelector('span').textContent = message;
    host.appendChild(item);
    setTimeout(function () {
      item.remove();
    }, 4200);
  }

  function setAuthError(alertId, textId, message) {
    var alertBox = $(alertId);
    alertBox.classList.remove('alert-custom-success');
    alertBox.classList.add('alert-custom-danger');
    if (!message) {
      alertBox.classList.add('d-none');
      $(textId).textContent = '';
      return;
    }
    $(textId).textContent = message;
    alertBox.classList.remove('d-none');
  }

  function setLoginError(message) {
    setAuthError('login-alert', 'login-alert-text', message);
  }

  function setRegisterError(message) {
    setAuthError('register-alert', 'register-alert-text', message);
  }

  function todayIsoLocal() {
    var date = new Date();
    return date.getFullYear() + '-' +
      ('0' + (date.getMonth() + 1)).slice(-2) + '-' +
      ('0' + date.getDate()).slice(-2);
  }

  function showAuthMode(mode) {
    var register = mode === 'register';
    $('login-form').classList.toggle('d-none', register);
    $('register-form').classList.toggle('d-none', !register);
    $('auth-title').textContent = register ? 'Create your account' : 'Welcome back';
    $('auth-subtitle').textContent = register
      ? 'Choose the organisation name you want to use. Your diary stays private to this account.'
      : 'Sign in to record the days you actually work';
    $('auth-switch').innerHTML = register
      ? 'Already have an account? <button type="button" id="btn-show-login">Sign in</button>'
      : 'New here? <button type="button" id="btn-show-register">Create an account</button>';
    var switchBtn = register ? $('btn-show-login') : $('btn-show-register');
    switchBtn.addEventListener('click', function () {
      setLoginError('');
      setRegisterError('');
      showAuthMode(register ? 'login' : 'register');
    });
    fillIcons($('auth-switch'));
    if (register && !$('register-start').value) {
      $('register-start').value = '2026-09-07';
    }
  }

  function bindPasswordToggle(buttonId, inputId) {
    $(buttonId).addEventListener('click', function () {
      var input = $(inputId);
      var hidden = input.getAttribute('type') === 'password';
      input.setAttribute('type', hidden ? 'text' : 'password');
      this.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
      this.innerHTML = iconSvg(hidden ? 'eye-off' : 'eye');
    });
  }

  function organisationName(profile) {
    return (profile && (profile.organisation || profile.company)) || 'Daily Diary';
  }

  function showView(name) {
    $('app-boot').classList.add('d-none');
    $('view-login').classList.toggle('d-none', name !== 'login');
    $('view-app').classList.toggle('d-none', name !== 'app');
  }

  function applyProfile(profile) {
    state.profile = profile;
    var name = profile.name || 'Intern';
    var email = profile.email || '';
    var org = organisationName(profile);
    var mark = initials(name);
    $('brand-label').textContent = org;
    $('navbar-kicker').textContent = org;
    $('footer-org').textContent = org;
    $('sidebar-name').textContent = name;
    $('sidebar-email').textContent = email;
    $('sidebar-initials').textContent = mark;
    $('nav-name').textContent = name;
    $('nav-initials').textContent = mark;
    $('profile-welcome').textContent = 'Welcome, ' + name;
    $('profile-org').textContent = org;
    $('profile-email').textContent = email;
    $('nav-admin-item').classList.toggle('d-none', profile.role !== 'admin');
  }

  function closeSidebar() {
    $('sidebar').classList.remove('show');
    $('sidebar-overlay').classList.remove('show');
  }

  function showPanel(name) {
    state.panel = name;
    ['diary', 'summary', 'tasks', 'admin'].forEach(function (panel) {
      var el = $('panel-' + panel);
      if (el) {
        el.classList.toggle('d-none', panel !== name);
      }
    });
    document.querySelectorAll('.sidebar-menu-link').forEach(function (link) {
      link.classList.toggle('active', link.getAttribute('data-panel') === name);
    });
    closeSidebar();
    if (name === 'summary') {
      setPanelBusy('panel-summary', true, 'Loading summary…');
      loadSummary().then(function () {
        setPanelBusy('panel-summary', false);
      });
    }
    if (name === 'tasks') {
      setPanelBusy('panel-tasks', true, 'Loading tasks…');
      loadTasks().then(function () {
        setPanelBusy('panel-tasks', false);
      });
    }
    if (name === 'admin') {
      setPanelBusy('panel-admin', true, 'Loading accounts…');
      loadAdminUsers().then(function () {
        setPanelBusy('panel-admin', false);
      });
    }
  }

  function renderWeekDots(day) {
    var host = $('week-dots');
    host.innerHTML = '';
    (day.weekDays || []).forEach(function (item) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'week-dot';
      if (item.saved) {
        btn.classList.add('is-saved');
      }
      if (item.date === day.date) {
        btn.classList.add('is-current');
      }
      btn.textContent = item.short;
      btn.setAttribute('aria-label', item.weekday + (item.saved ? ' saved' : ' not saved'));
      btn.addEventListener('click', function () {
        if (item.date === state.date) {
          return;
        }
        loadDay(item.date).catch(function () { return null; });
      });
      host.appendChild(btn);
    });
  }

  function applyFormValues(timeIn, timeOut, reason, assignment, leftBeforeNoon) {
    state.leftBeforeNoon = !!leftBeforeNoon || isMorningTime(timeOut);
    state.timeIn.setValue(timeIn || '');
    state.timeOut.setValue(timeOut || '', state.leftBeforeNoon);
    $('time-out-reason').value = reason || '';
    $('assignment-list').value = assignment || '';
    syncReasonBox();
    refreshHours();
  }

  function renderDay(day, options) {
    options = options || {};
    applyingDay = true;
    state.day = day;
    state.date = day.date;
    state.weekStart = day.weekStart;
    $('day-title').textContent = day.weekday;
    $('day-subtitle').textContent = formatDisplayDate(day.date) + ' · ' + day.weekLabel;
    $('week-label').textContent = day.weekLabel;
    $('btn-prev-day').disabled = !day.canPrev;
    $('stat-days').textContent = day.stats.daysLogged + ' / 7';
    $('stat-hours').textContent = day.stats.totalHours;
    $('stat-week-badge').textContent = day.weekLabel;
    $('stat-week-copy').textContent = day.weekRangeShort || '';
    renderWeekDots(day);

    var inHost = $('time-in-host');
    var outHost = $('time-out-host');
    inHost.innerHTML = '';
    outHost.innerHTML = '';
    state.timeIn = createClock({ label: 'Time in', mode: 'in', value: day.timeIn });
    state.timeOut = createClock({
      label: 'Time out',
      mode: 'out',
      value: day.timeOut,
      allowMorning: isMorningTime(day.timeOut) || !!day.timeOutReason
    });
    inHost.appendChild(state.timeIn);
    outHost.appendChild(state.timeOut);

    applyFormValues(day.timeIn, day.timeOut, day.timeOutReason, day.assignment, isMorningTime(day.timeOut) || !!day.timeOutReason);

    var draft = options.skipDraft ? null : readDraft(day.date);
    var restored = false;
    if (shouldRestoreDraft(day, draft)) {
      applyFormValues(draft.timeIn, draft.timeOut, draft.timeOutReason, draft.assignment, draft.leftBeforeNoon);
      restored = true;
    }
    $('draft-note').classList.toggle('d-none', !restored);

    function onClockChange() {
      refreshHours();
      syncReasonBox();
      scheduleDraft();
    }
    state.timeIn.onChange(onClockChange);
    state.timeOut.onChange(onClockChange);
    state.timeOut.onMorning(function (on) {
      state.leftBeforeNoon = !!on;
      syncReasonBox();
    });

    applyingDay = false;
  }

  function loadDay(date, options) {
    options = options || {};
    if (state.date && !options.skipWrite) {
      writeDraftNow();
    }
    setPanelBusy('panel-diary', true, 'Loading day…');
    return api('getDay', { token: state.token, date: date || state.date }).then(function (result) {
      renderDay(result);
      return result;
    }).catch(function (err) {
      showToast(err.message, 'error');
      throw err;
    }).then(function (result) {
      setPanelBusy('panel-diary', false);
      return result;
    }, function (err) {
      setPanelBusy('panel-diary', false);
      throw err;
    });
  }

  function collectEntry() {
    return {
      date: state.date,
      timeIn: state.timeIn ? state.timeIn.getValue() : '',
      timeOut: state.timeOut ? state.timeOut.getValue() : '',
      assignment: $('assignment-list').value,
      timeOutReason: state.leftBeforeNoon || isMorningTime(state.timeOut ? state.timeOut.getValue() : '')
        ? $('time-out-reason').value
        : ''
    };
  }

  function saveDay(button, thenNext) {
    var entry = collectEntry();
    if (!entry.timeIn || !entry.timeOut) {
      showToast('Choose time in and time out first.', 'error');
      return Promise.resolve();
    }
    if (!String(entry.assignment || '').trim()) {
      showToast('Enter the intern job assignment.', 'error');
      return Promise.resolve();
    }
    if (isMorningTime(entry.timeOut) && !String(entry.timeOutReason || '').trim()) {
      showToast('Time out is AM. Enter a reason for leaving before noon.', 'error');
      return Promise.resolve();
    }
    writeDraftNow();
    setButtonBusy(button, true, 'Saving…');
    return api('saveEntry', { token: state.token, entry: entry }).then(function (result) {
      clearDraft(entry.date);
      renderDay(result.day, { skipDraft: true });
      showToast(formatDisplayDate(entry.date) + ' saved.');
      if (thenNext && result.day && result.day.date) {
        return loadDay(nextWeekday(result.day.date), { skipWrite: true });
      }
    }).catch(function (err) {
      showToast(err.message, 'error');
      if (/session expired/i.test(err.message)) {
        expireSession();
      }
    }).then(function () {
      setButtonBusy(button, false);
    });
  }

    stats[1].textContent = week.totalHours + ' hrs';

  function updateProgressRing(wrap, percent) {
    var radius = 34;
    var circ = 2 * Math.PI * radius;
    var offset = circ - (percent / 100) * circ;
    var value = wrap.querySelector('.progress-ring-value');
    value.style.strokeDasharray = String(circ);
    value.style.strokeDashoffset = String(offset);
    wrap.querySelector('.progress-ring-label').textContent = percent + '%';
  }

  function progressRing(percent) {
    var wrap = document.createElement('div');
    wrap.className = 'progress-ring';
    wrap.innerHTML =
      '<svg viewBox="0 0 80 80" aria-hidden="true">' +
      '<circle class="progress-ring-bg" cx="40" cy="40" r="34"></circle>' +
      '<circle class="progress-ring-value" cx="40" cy="40" r="34"></circle>' +
      '</svg>' +
      '<span class="progress-ring-label"></span>';
    updateProgressRing(wrap, percent);
    return wrap;
  }

  function dueBucket(dueDate, today) {
    if (!dueDate) {
      return 'none';
    }
    if (dueDate < today) {
      return 'overdue';
    }
    if (dueDate <= addDaysIso(today, 2)) {
      return 'soon';
    }
    return 'upcoming';
  }

  function isTaskComplete(task) {
    return !!(task.complete || (task.totalCount > 0 && task.doneCount === task.totalCount));
  }

  function taskMatchesFilter(task, filter, today) {
    if (filter === 'all') {
      return true;
    }
    if (filter === 'urgent') {
      return task.priority === 'urgent' && !isTaskComplete(task);
    }
    if (filter === 'soon') {
      var bucket = dueBucket(task.dueDate, today);
      return !isTaskComplete(task) && (bucket === 'overdue' || bucket === 'soon');
    }
    if (filter === 'open') {
      return !isTaskComplete(task);
    }
    return true;
  }

    state.editingTaskId = '';
    $('task-id').value = '';
    $('task-title').value = '';
    $('task-notes').value = '';
    $('task-priority').value = 'medium';

    $('task-form-title').textContent = 'Add a task';
    $('btn-add-task').innerHTML = iconSvg('plus') + '<span>Add task</span>';
    $('btn-add-task').removeAttribute('data-idle-html');
    $('btn-cancel-edit').classList.add('d-none');

  function startEditTask(task) {
    state.editingTaskId = task.id;
    $('task-id').value = task.id;
    $('task-title').value = task.title || '';
    $('task-notes').value = task.notes || '';
    $('task-priority').value = task.priority || 'medium';
    $('task-due').value = task.dueDate || '';
    $('task-form-title').textContent = 'Edit task';
    $('btn-add-task').innerHTML = iconSvg('save') + '<span>Save changes</span>';
    $('btn-add-task').removeAttribute('data-idle-html');
    $('btn-cancel-edit').classList.remove('d-none');
    $('task-title').focus();
    $('panel-tasks').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function createSubtaskRow(task, sub) {
    var row = document.createElement('label');
    row.className = 'subtask-row' + (sub.done ? ' is-done' : '');
    row.setAttribute('data-subtask-id', sub.id);
    var check = document.createElement('input');
    check.type = 'checkbox';
    check.className = 'form-check-input-custom';
    check.checked = !!sub.done;
    check.addEventListener('change', function () {
      toggleSubtaskRow(task.id, sub.id, check, row);
    });
    var text = document.createElement('span');
    text.textContent = sub.title;
    var delSub = document.createElement('button');
    delSub.type = 'button';
    delSub.className = 'subtask-delete';
    delSub.innerHTML = iconSvg('x');
    delSub.setAttribute('aria-label', 'Delete subtask');
    delSub.addEventListener('click', function (event) {
      event.preventDefault();
      deleteSubtaskRow(task.id, sub.id, delSub, row);
    });
    row.appendChild(check);
    row.appendChild(text);
    row.appendChild(delSub);
    return row;
  }

  function applyTaskResult(result) {
    renderTasks(result);
  }

  function toggleSubtaskRow(taskId, subId, check, row) {
    check.disabled = true;
    row.classList.add('is-busy');
    api('toggleSubtask', { token: state.token, id: subId }).then(function (result) {
      applyTaskResult(result);
    }).catch(function (err) {
      check.checked = !check.checked;
      showToast(err.message, 'error');
    }).then(function () {
      check.disabled = false;
      row.classList.remove('is-busy');
    });
  }

  function deleteSubtaskRow(taskId, subId, button, row) {
    setButtonBusy(button, true, '');
    row.classList.add('is-busy');
    api('deleteSubtask', { token: state.token, id: subId }).then(function (result) {
      applyTaskResult(result);
    }).catch(function (err) {
      showToast(err.message, 'error');
      setButtonBusy(button, false);
      row.classList.remove('is-busy');
    });
  }

  function buildTaskCard(task) {
    var card = document.createElement('div');
    card.className = 'card task-card';
    card.setAttribute('data-task-id', task.id);

    var head = document.createElement('div');
    head.className = 'task-card-head';

    var info = document.createElement('div');
    info.className = 'task-card-info';
    var title = document.createElement('h3');
    title.className = 'task-card-title';
    title.textContent = task.title;
    info.appendChild(title);

    var tags = document.createElement('div');
    tags.className = 'task-tags';
    var priority = document.createElement('span');
    priority.className = 'priority-tag is-' + (task.priority || 'medium');
    priority.textContent = PRIORITY_LABELS[task.priority] || 'Medium';
    tags.appendChild(priority);
    if (task.dueDate) {
      var due = document.createElement('span');
      var bucket = dueBucket(task.dueDate, state.taskToday || todayIsoLocal());
      due.className = 'due-date' + (bucket === 'overdue' ? ' is-overdue' : bucket === 'soon' ? ' is-soon' : '');
      due.textContent = (bucket === 'overdue' ? 'Overdue · ' : 'Due · ') + formatDisplayDate(task.dueDate);
      tags.appendChild(due);
    }
    info.appendChild(tags);

    if (task.notes) {
      var notes = document.createElement('p');
      notes.className = 'task-card-notes';
      notes.textContent = task.notes;
      info.appendChild(notes);
    }
    var meta = document.createElement('p');
    meta.className = 'task-card-meta';
    meta.textContent = task.doneCount + ' of ' + task.totalCount + ' subtasks done';
    info.appendChild(meta);

    var actions = document.createElement('div');
    actions.className = 'task-card-actions';
    var editTask = document.createElement('button');
    editTask.type = 'button';
    editTask.className = 'btn-custom btn-custom-sm btn-custom-light';
    editTask.innerHTML = iconSvg('pen');
    editTask.setAttribute('aria-label', 'Edit task');
    editTask.addEventListener('click', function () {
      startEditTask(task);
    });
    var delTask = document.createElement('button');
    delTask.type = 'button';
    delTask.className = 'btn-custom btn-custom-sm btn-custom-light';
    delTask.innerHTML = iconSvg('trash');
    delTask.setAttribute('aria-label', 'Delete task');
    delTask.addEventListener('click', function () {
      setButtonBusy(delTask, true, 'Deleting…');
      card.classList.add('is-busy');
      api('deleteTask', { token: state.token, id: task.id }).then(function (result) {
        if (state.editingTaskId === task.id) {
          resetTaskForm();
        }
        applyTaskResult(result);
        showToast('Task deleted.');
      }).catch(function (err) {
        showToast(err.message, 'error');
        setButtonBusy(delTask, false);
        card.classList.remove('is-busy');
      });
    });
    actions.appendChild(progressRing(task.percent));
    actions.appendChild(editTask);
    actions.appendChild(delTask);
    head.appendChild(info);
    head.appendChild(actions);
    card.appendChild(head);

    var subList = document.createElement('div');
    subList.className = 'subtask-list';
    task.subtasks.forEach(function (sub) {
      subList.appendChild(createSubtaskRow(task, sub));
    });
    card.appendChild(subList);

    var addRow = document.createElement('form');
    addRow.className = 'subtask-form';
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'form-control-custom';
    input.maxLength = 180;
    input.placeholder = 'Add a subtask';
    input.required = true;
    var addBtn = document.createElement('button');
    addBtn.type = 'submit';
    addBtn.className = 'btn-custom btn-custom-sm btn-custom-primary';
    addBtn.innerHTML = iconSvg('plus') + '<span>Add</span>';
    addRow.appendChild(input);
    addRow.appendChild(addBtn);
    addRow.addEventListener('submit', function (event) {
      event.preventDefault();
      setButtonBusy(addBtn, true, 'Adding…');
      api('saveSubtask', {
        token: state.token,
        subtask: { taskId: task.id, title: input.value }
      }).then(function (result) {
        input.value = '';
        applyTaskResult(result);
        showToast('Subtask added.');
      }).catch(function (err) {
        showToast(err.message, 'error');
      }).then(function () {
        setButtonBusy(addBtn, false);
      });
    });
    card.appendChild(addRow);
    return card;
  }

  function renderTasks(result) {
    state.tasks = result.tasks || [];
    state.taskToday = result.today || todayIsoLocal();
    var list = $('tasks-list');
    list.innerHTML = '';
    var today = state.taskToday;
    var filtered = state.tasks.filter(function (task) {
      return taskMatchesFilter(task, state.taskFilter, today);
    });
    if (!state.tasks.length) {
      var empty = document.createElement('div');
      empty.className = 'card';
      empty.textContent = 'No tasks yet. Add one above.';
      list.appendChild(empty);
      return;
    }
    if (!filtered.length) {
      var none = document.createElement('div');
      none.className = 'card';
      none.textContent = 'No tasks match this filter.';
      list.appendChild(none);
      return;
    }
    var groups = [
      { id: 'overdue', title: 'Overdue' },
      { id: 'soon', title: 'Due soon' },
      { id: 'upcoming', title: 'Upcoming' },
      { id: 'none', title: 'No date' }
    ];
    groups.forEach(function (group) {
      var items = filtered.filter(function (task) {
        return dueBucket(task.dueDate, today) === group.id;
      });
      if (!items.length) {
        return;
      }
      var section = document.createElement('div');
      section.className = 'task-group';
      var heading = document.createElement('h3');
      heading.className = 'task-group-title';
      heading.textContent = group.title;
      section.appendChild(heading);
      items.forEach(function (task) {
        section.appendChild(buildTaskCard(task));
      });
      list.appendChild(section);
    });
  }

    }).catch(function (err) {

  function shiftDay(direction, button) {
    if (!state.date) {
      return;
    }
    var next = direction < 0 ? previousWeekday(state.date) : nextWeekday(state.date);
    setButtonBusy(button, true, 'Loading…');
    loadDay(next).catch(function () { return null; }).then(function () {
      setButtonBusy(button, false);
    });
  }

  function bindChrome() {
    bindPasswordToggle('toggle-password', 'login-password');
    bindPasswordToggle('toggle-register-password', 'register-password');
    $('login-form').addEventListener('submit', function (event) {
      event.preventDefault();
      setLoginError('');
      var email = $('login-email').value.trim();
      var password = $('login-password').value;
      var button = $('btn-login');
      setButtonBusy(button, true, 'Signing in…');
      api('login', { email: email, password: password }).then(function (result) {
        if ($('remember-me').checked) {
          localStorage.setItem(EMAIL_KEY, email);
        } else {
          localStorage.removeItem(EMAIL_KEY);
        }
        return enterApp(result.token, result.profile);
      }).catch(function (err) {
        if (state.token) {
          showToast(err.message, 'error');
        } else {
          setLoginError(err.message);
        }
      }).then(function () {
        setButtonBusy(button, false);
      });
    });

    $('register-form').addEventListener('submit', function (event) {
      event.preventDefault();
      setRegisterError('');
      var button = $('btn-register');
      setButtonBusy(button, true, 'Creating account…');
      api('register', {
        name: $('register-name').value,
        organisation: $('register-org').value,
        email: $('register-email').value,
        password: $('register-password').value,
        programmeStart: $('register-start').value
      }).then(function (result) {
        localStorage.setItem(EMAIL_KEY, $('register-email').value.trim().toLowerCase());
        $('login-email').value = $('register-email').value.trim();
        $('remember-me').checked = true;
        if (result.pending) {
          setRegisterError('');
          $('register-alert').classList.remove('d-none', 'alert-custom-danger');
          $('register-alert').classList.add('alert-custom-success');
          $('register-alert-text').textContent = result.message || 'Account created. Wait for admin approval, then sign in.';
          showAuthMode('login');
          setLoginError('');
          $('login-alert').classList.remove('d-none', 'alert-custom-danger');
          $('login-alert').classList.add('alert-custom-success');
          $('login-alert-text').textContent = result.message || 'Account created. Wait for admin approval, then sign in.';
          return null;
        }
        return enterApp(result.token, result.profile);
      }).catch(function (err) {
        $('register-alert').classList.remove('alert-custom-success');
        $('register-alert').classList.add('alert-custom-danger');
        setRegisterError(err.message);
      }).then(function () {
        setButtonBusy(button, false);
      });
    });

    $('sidebar-toggle').addEventListener('click', function () {
      $('sidebar').classList.toggle('show');
      $('sidebar-overlay').classList.toggle('show', $('sidebar').classList.contains('show'));
    });
    $('sidebar-overlay').addEventListener('click', closeSidebar);

    document.querySelectorAll('[data-panel]').forEach(function (link) {
      link.addEventListener('click', function (event) {
        event.preventDefault();
        showPanel(link.getAttribute('data-panel'));
      });
    });
    $('brand-home').addEventListener('click', function (event) {
      event.preventDefault();
      showPanel('diary');
    });

    $('btn-prev-day').addEventListener('click', function () {
      shiftDay(-1, this);
    });
    $('btn-next-day').addEventListener('click', function () {
      shiftDay(1, this);
    });
    $('btn-add-line').addEventListener('click', function () {
      var box = $('assignment-list');
      var value = box.value;
      if (value && !/\n$/.test(value)) {
        value += '\n';
      }
      box.value = value + '- ';
      box.focus();
      scheduleDraft();
    });
    $('assignment-list').addEventListener('input', scheduleDraft);
    $('time-out-reason').addEventListener('input', scheduleDraft);
    $('btn-save-day').addEventListener('click', function () {
      saveDay(this, false);
    });
    $('btn-save-next').addEventListener('click', function () {
      saveDay(this, true);
    });
    $('btn-send-week').addEventListener('click', function () {
      sendWeekToSheet(this);
    });
    $('btn-send-week-summary').addEventListener('click', function () {
      sendWeekToSheet(this);
    });
    $('report-form').addEventListener('submit', function (event) {
      event.preventDefault();
      connectReportSheet($('btn-connect-sheet'));
    });
    $('btn-logout').addEventListener('click', function () {
      api('logout', { token: state.token }).catch(function () { return null; }).then(expireSession);
    });

    $('task-filters').addEventListener('click', function (event) {
      var chip = event.target.closest('[data-filter]');
      if (!chip) {
        return;
      }
      state.taskFilter = chip.getAttribute('data-filter');
      Array.prototype.slice.call($('task-filters').querySelectorAll('[data-filter]')).forEach(function (item) {
        item.classList.toggle('is-active', item === chip);
      });
      renderTasks({ tasks: state.tasks, today: state.taskToday });
    });

    $('btn-cancel-edit').addEventListener('click', resetTaskForm);
    $('btn-alert-dismiss').addEventListener('click', hideTaskAlertModal);
    $('btn-alert-tasks').addEventListener('click', function () {
      hideTaskAlertModal();
      showPanel('tasks');
    });

    $('task-form').addEventListener('submit', function (event) {
      event.preventDefault();
      var button = $('btn-add-task');
      var editing = !!$('task-id').value;
      setButtonBusy(button, true, editing ? 'Saving…' : 'Adding…');
      api('saveTask', {
        token: state.token,
        task: {
          id: $('task-id').value,
          title: $('task-title').value,
          notes: $('task-notes').value,
          priority: $('task-priority').value,
          dueDate: $('task-due').value
        }
      }).then(function (result) {
        resetTaskForm();
        applyTaskResult(result);
        showToast(editing ? 'Task updated.' : 'Task added.');
      }).catch(function (err) {
        showToast(err.message, 'error');
      }).then(function () {
        setButtonBusy(button, false);
      });
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    bindChrome();
    fillIcons();
    showAuthMode('login');
    var remembered = localStorage.getItem(EMAIL_KEY) ||
      localStorage.getItem('kenyaDiaryEmail') ||
      localStorage.getItem('leyaDiaryEmail');
    if (remembered) {
      $('login-email').value = remembered;
      $('remember-me').checked = true;
    }
    if (!$('register-start').value) {
      $('register-start').value = '2026-09-07';
    }

    var token = sessionStorage.getItem(TOKEN_KEY) ||
      sessionStorage.getItem('kenyaDiaryToken') ||
      sessionStorage.getItem('leyaDiaryToken');
    if (!token) {
      showView('login');
      return;
    }

    api('session', { token: token }).then(function (result) {
      return enterApp(token, result.profile);
    }).catch(function () {
      expireSession();
    });
  });
})();
</script>
